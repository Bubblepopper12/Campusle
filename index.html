    <script>
      // Pick the scene (lecture hall or stadium) before first paint so there's no flash of the other one.
      try {
        var h = location.hash.slice(1).toLowerCase();
        document.documentElement.dataset.mode = h === "gridiron" || h === "football" || h === "cfb" ? "gridiron" : h === "players" ? "cards" : "classic";
      } catch (e) {}
    </script>
